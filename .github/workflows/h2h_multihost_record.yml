# Step 2 of analyze -> record -> gate: re-measure and emit h2h_multihost_baselines.json.
# Copy it from the bundle (or the data branch) to tpu_sync/benchmarks/ and commit it for the gate.
name: H2H Multi-Host Record

on:
  workflow_dispatch:
    inputs:
      publish_branch:
        description: "Branch that receives the bundled artifacts (CSV/SVG/report/baselines) under h2h_multihost/."
        required: false
        type: string
        default: "benchmark-data"

permissions:
  contents: read

jobs:
  record:
    name: Run H2H Multi-Host Record
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@82682aceae058a272d67c5e8bb4e8eba2da7b7c2 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      registry_file: "tpu_sync/benchmarks/benchmark_registry_h2h_multihost_record.pbtxt"
      bap_ref: "82682aceae058a272d67c5e8bb4e8eba2da7b7c2"
      runner: "linux-x86-n2-8"

  # Optional: cache the bundle on a branch. Delete this job if you only want the
  # downloadable Actions artifact.
  publish:
    needs: record
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && needs.record.outputs.job_id != '' }}
    uses: ./.github/workflows/h2h_publish_results.yml
    permissions:
      contents: write
    with:
      job_id: ${{ needs.record.outputs.job_id }}
      stage: record
      publish_branch: ${{ inputs.publish_branch }}
