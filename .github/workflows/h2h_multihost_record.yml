# Re-record cross-host H2H gate floors on the multi-host runner, download
# h2h_multihost_baselines.json from the run's BAP artifact, keep only the P=1
# gate config, and commit it to tpu_sync/benchmarks/h2h_multihost_baselines.json.
name: H2H Multi-Host Record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Run H2H Multi-Host Record
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@df45de4a2390d7510af1e9d747f47cd6f6b9bb94 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      registry_file: "tpu_sync/benchmarks/benchmark_registry_h2h_multihost_record.pbtxt"
      bap_ref: "df45de4a2390d7510af1e9d747f47cd6f6b9bb94"
      runner: "linux-x86-n2-8"
