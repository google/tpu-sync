# Reusable: copy a BAP run's bundled artifacts into a data branch so plots/CSVs are
# browsable and linkable. Called by h2h_multihost_analyze.yml / _record.yml; delete the
# `publish` job there if you do not want the branch cache (artifacts stay downloadable
# from the Actions run either way).
name: H2H Publish Results

on:
  workflow_call:
    inputs:
      job_id:
        description: "BAP job_id (needs.<bap job>.outputs.job_id); the bundle artifact is artifacts-<job_id>."
        required: true
        type: string
      stage:
        description: "analyze | record (used in the run folder name and the README index)."
        required: true
        type: string
      publish_branch:
        description: "Branch that receives the bundle under h2h_multihost/."
        required: false
        type: string
        default: "benchmark-data"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to ${{ inputs.publish_branch }}
    runs-on: linux-x86-n2-8
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest@sha256:9fded8d1413cabb6ef043611cbe446471e842a429e100d96d4ea183f2821e270 # ratchet:us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    permissions:
      contents: write
    concurrency:
      group: h2h-multihost-publish-${{ inputs.publish_branch }}
      cancel-in-progress: false
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1 # zizmor: ignore[unpinned-uses]
        with:
          name: artifacts-${{ inputs.job_id }}
          path: bundle

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.0 # zizmor: ignore[unpinned-uses]
        with:
          path: repo
          fetch-depth: 1
          # The token stays in .git so the push below can use plain "origin".
          persist-credentials: true

      - name: Commit and push
        shell: bash
        working-directory: repo
        env:
          PUBLISH_BRANCH: ${{ inputs.publish_branch }}
          STAGE: ${{ inputs.stage }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "::group::Commit and push"
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/bundle"
          SHA8="${SHA:0:8}"
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          RUN_NAME="${STAMP}-${SHA8}-${STAGE}-r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # NOTE: bash ignores `set -e` inside a function called from `if`, so
          # every step that must not be skipped carries an explicit `|| return 1`.
          publish_once() {
            # Fresh view of the data branch; orphan it on first use.
            if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null; then
              git fetch --depth=1 origin "$PUBLISH_BRANCH" || return 1
              git checkout -B "$PUBLISH_BRANCH" FETCH_HEAD || return 1
            else
              # Unborn branch; also discards a local branch left by a failed attempt.
              git symbolic-ref HEAD "refs/heads/$PUBLISH_BRANCH" || return 1
              git update-ref -d "refs/heads/$PUBLISH_BRANCH" 2>/dev/null || true
              git rm -r -q --cached --ignore-unmatch . || return 1
              git clean -fdxq || return 1
            fi

            mkdir -p h2h_multihost || return 1
            rm -rf "h2h_multihost/$RUN_NAME" h2h_multihost/latest || return 1
            cp -R "$BUNDLE" "h2h_multihost/$RUN_NAME" || return 1
            cp -R "h2h_multihost/$RUN_NAME" h2h_multihost/latest || return 1

            SVG="$(cd "h2h_multihost/$RUN_NAME" && find . -name h2h_multihost_dist.svg | head -n 1 | sed 's#^\./##')"
            REPORT="$(cd "h2h_multihost/$RUN_NAME" && find . -name h2h_multihost_report.md | head -n 1 | sed 's#^\./##')"
            SVG_LINK="-"; [[ -n "$SVG" ]] && SVG_LINK="[dist.svg](${RUN_NAME}/${SVG})"
            REPORT_LINK="-"; [[ -n "$REPORT" ]] && REPORT_LINK="[report.md](${RUN_NAME}/${REPORT})"

            README=h2h_multihost/README.md
            if [[ ! -f "$README" ]] || ! grep -q '^|---' "$README"; then
              {
                echo "# H2H multi-host benchmark runs"
                echo
                echo "Newest first. One row per BAP run; \`latest/\` mirrors the most recent one."
                echo
                echo "| date (UTC) | stage | commit | run | dist | report |"
                echo "|---|---|---|---|---|---|"
              } > "$README"
            fi
            ROW="| ${STAMP} | ${STAGE} | [${SHA8}](${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}) | [run](${RUN_URL}) | ${SVG_LINK} | ${REPORT_LINK} |"
            awk -v row="$ROW" '{ print } /^\|---/ && !done { print row; done = 1 }' "$README" > "$README.tmp" || return 1
            mv "$README.tmp" "$README" || return 1

            git add -A h2h_multihost || return 1
            if git diff --cached --quiet; then
              echo "Nothing to publish."
              return 0
            fi
            git commit -q -m "h2h_multihost ${STAGE} ${STAMP} @ ${SHA8}" -m "Run: ${RUN_URL}" || return 1
            git push origin "HEAD:refs/heads/${PUBLISH_BRANCH}"
          }

          published=0
          for attempt in 1 2 3; do
            if publish_once; then
              echo "Published h2h_multihost/${RUN_NAME} to ${PUBLISH_BRANCH}."
              published=1
              break
            fi
            echo "Publish attempt ${attempt} failed (concurrent push?); retrying from the remote tip."
            sleep 5
          done
          echo "::endgroup::"
          if [[ "$published" != "1" ]]; then
            echo "Failed to publish after 3 attempts."
            exit 1
          fi
