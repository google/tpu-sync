name: Nightly Benchmarks

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day

permissions:
  contents: read

jobs: 
  run_benchmarks:
    name: Run Single Host Benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@df45de4a2390d7510af1e9d747f47cd6f6b9bb94 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      registry_file: "tpu_sync/benchmarks/benchmark_registry.pbtxt"
      bap_ref: "df45de4a2390d7510af1e9d747f47cd6f6b9bb94"
      runner: "linux-x86-n2-8"

  run_multihost_benchmarks:
    name: Run Multi-Host Benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@df45de4a2390d7510af1e9d747f47cd6f6b9bb94 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      registry_file: "tpu_sync/benchmarks/benchmark_registry_h2h_multihost_gate.pbtxt"
      bap_ref: "df45de4a2390d7510af1e9d747f47cd6f6b9bb94"
      runner: "linux-x86-n2-8"
