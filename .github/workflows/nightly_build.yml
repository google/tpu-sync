# Nightly build of the tpu_sync wheels: tpu_sync_jax and tpu_sync_torch.
#
# Wheels are versioned <pyproject base>.dev<UTC timestamp> (same scheme as
# torch_tpu) and built inside the ml-build container by
# ci/build_wheel_impl.sh. Every run keeps the wheels as GitHub Actions
# artifacts; scheduled runs (and dispatches that opt in) additionally upload
# them to the tpu-sync Artifact Registry, where they install with a pinned
# version from that index only (deps come from PyPI in a separate step; never
# use --extra-index-url here, see RELEASING.md):
#
#   pip install --pre --no-deps "tpu_sync_jax==<version>" \
#     --index-url https://us-python.pkg.dev/cloud-tpu-inference-test/tpu-raiden/simple/
#
# Scheduled runs also publish the nightlies to PyPI as .dev pre-releases
# through the OSS exit gate (publish_pypi.yml); a dispatch publishes only when
# asked. Wheels above the PyPI file limit are skipped, not fatal, so the
# registry always gets every wheel and PyPI gets the ones that fit.
#
# The jax wheels are multi-ABI (one consolidated _tpu_raiden_jax_<ver>.so per
# supported JAX release) and built per supported Python minor version (3.12,
# 3.13) via build_jax_wheels.yml.
#
# The torch wheel needs no torch_tpu checkout: the build resolves the
# torch_tpu module from shims/torch_tpu, backed by the torch_tpu
# wheel named in torch_tpu.version, and ships one extension variant per
# torch release listed in ci/build_wheel_impl.sh; the extension binds
# torch_tpu's symbols at import to the installed torch_tpu wheel.
#
# Every run also keeps a nightly-manifest-<version> artifact naming the commit
# it built, so that a wheel version maps back to its commit on main; the
# golden-commit workflow (golden_commit.yml) reads it through the artifacts
# API, from the artifact's workflow run.
#
# Repository variables:
#   vars.RAIDEN_REGISTRY_URL      (optional) overrides the Artifact Registry
#                                 upload URL
#   vars.PYPI_FILE_LIMIT_MB       see publish_pypi.yml

name: Nightly Wheels

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      jax_abis:
        description: "JAX releases bundled in each jax wheel, space-separated (empty = WHEEL_ABIS in third_party/jax/versions.bzl)"
        required: false
        default: ""
        type: string
      python_versions:
        description: "Python minor versions for jax wheels, space-separated (e.g. '3.12 3.13')"
        required: false
        default: "3.12 3.13"
        type: string
      upload_to_registry:
        description: "Upload wheels to the tpu-sync Artifact Registry?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      publish_to_pypi:
        description: "Publish the wheels to PyPI through the exit gate (as .dev pre-releases)?"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
      use_remote_cache:
        description: "Use the remote bazel cache (--config=ci)?"
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RAIDEN_REGISTRY_URL: ${{ vars.RAIDEN_REGISTRY_URL || 'https://us-python.pkg.dev/cloud-tpu-inference-test/tpu-raiden/' }}

jobs:
  version:
    name: "Stamp nightly version"
    runs-on: ubuntu-latest
    outputs:
      wheel_version_extras: ${{ steps.stamp.outputs.wheel_version_extras }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - id: stamp
        # One timestamp for the whole run so the jax and torch wheels of a
        # single nightly share a version.
        run: |
          BASE_VERSION=$(sed -n -E 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          EXTRAS=".dev$(date -u +%Y%m%d%H%M%S)"
          echo "wheel_version_extras=${EXTRAS}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}${EXTRAS}" >> "$GITHUB_OUTPUT"
      # The artifact's name carries the version and its workflow run carries
      # the commit; the file repeats both for anyone who downloads it.
      - name: Write nightly manifest
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          mkdir -p manifest
          printf '{"version": "%s", "commit": "%s", "run_url": "%s/%s/actions/runs/%s"}\n' \
            "${VERSION}" "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
            > manifest/nightly_manifest.json
          cat manifest/nightly_manifest.json
      - name: Upload nightly manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-manifest-${{ steps.stamp.outputs.version }}
          path: manifest/nightly_manifest.json
          retention-days: 90
          if-no-files-found: error

  jax-wheels:
    name: "Build and pack jax wheels"
    needs: version
    uses: ./.github/workflows/build_jax_wheels.yml
    with:
      jax_abis: ${{ inputs.jax_abis || '' }}
      python_versions: ${{ inputs.python_versions || '3.12 3.13' }}
      wheel_version_extras: ${{ needs.version.outputs.wheel_version_extras }}
      use_remote_cache: ${{ inputs.use_remote_cache || 'yes' }}
      artifact_prefix: nightly-wheel-jax

  build-torch:
    name: "Build torch wheel"
    needs: version
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest@sha256:9644db6e0e969079b138547dd99818c02e6ab51d892c4675cf2f4edf02a1e71a
    timeout-minutes: 300
    steps:
      - name: Checkout tpu-sync
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          path: tpu-sync
      # Git security patch (CVE-2022-24765) blocks root from operating on
      # runner-owned directories. Tell Git explicitly to trust the workspace
      # inside this ephemeral container.
      - name: Fix Git Workspace Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/tpu-sync"
      - name: Build wheel
        shell: bash
        working-directory: tpu-sync
        env:
          BUILD_MODE: torch
          WHEEL_VERSION_EXTRAS: ${{ needs.version.outputs.wheel_version_extras }}
          EXTRA_BAZEL_FLAGS: ${{ (inputs.use_remote_cache || 'yes') == 'yes' && '--config=ci' || '' }}
        run: |
          export BAZEL_CACHE_DIR="${RUNNER_TEMP}/bazel_cache"
          bash ci/build_wheel_impl.sh
      - name: Check wheel metadata
        working-directory: tpu-sync
        env:
          WHEEL_VERSION_EXTRAS: ${{ needs.version.outputs.wheel_version_extras }}
        run: uv run --isolated --with twine twine check dist/*"${WHEEL_VERSION_EXTRAS}"-*.whl
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-wheel-torch
          path: tpu-sync/dist/*${{ needs.version.outputs.wheel_version_extras }}-*.whl
          if-no-files-found: error
      - name: Summarize
        working-directory: tpu-sync
        env:
          WHEEL_VERSION_EXTRAS: ${{ needs.version.outputs.wheel_version_extras }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/*"${WHEEL_VERSION_EXTRAS}"-*.whl >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: "Upload wheels to Artifact Registry"
    needs: [version, jax-wheels, build-torch]
    # Scheduled nightlies always publish; manual dispatches only on request.
    if: github.event_name == 'schedule' || inputs.upload_to_registry == 'yes'
    runs-on: linux-x86-n2-32
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest@sha256:9644db6e0e969079b138547dd99818c02e6ab51d892c4675cf2f4edf02a1e71a
    timeout-minutes: 30
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: nightly-wheel-*
          merge-multiple: true
          path: dist
      # Auth uses the runner's ambient GCP service account via the Artifact
      # Registry keyring backend.
      - name: Upload to Artifact Registry
        env:
          WHEEL_VERSION_EXTRAS: ${{ needs.version.outputs.wheel_version_extras }}
        run: |
          uv run --isolated \
            --with twine \
            --with keyrings.google-artifactregistry-auth \
            twine upload \
            --repository-url "${RAIDEN_REGISTRY_URL}" \
            dist/tpu_sync_*"${WHEEL_VERSION_EXTRAS}"-*.whl
          echo "Uploaded to ${RAIDEN_REGISTRY_URL}:" >> "$GITHUB_STEP_SUMMARY"
          ls dist/tpu_sync_*.whl >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: "Publish"
    needs: [version, jax-wheels, build-torch]
    if: github.event_name == 'schedule' || inputs.publish_to_pypi == 'yes'
    uses: ./.github/workflows/publish_pypi.yml
    with:
      artifact_pattern: nightly-wheel-*
      skip_over_limit: true
