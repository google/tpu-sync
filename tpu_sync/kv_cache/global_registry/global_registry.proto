syntax = "proto3";

package tpu_raiden.kv_cache.global_registry;

import "tpu_sync/rpc/raiden_service.proto";

option java_multiple_files = true;
option java_outer_classname = "GlobalRegistry";

// WARNING: This API is currently under active development and is not
// stabilized. It is subject to backward-incompatible changes without prior
// notice.
service GlobalRegistryService {
  // Registers a batch of KV cache entries.
  rpc Register(RegisterRequest) returns (RegisterResponse) {  }

  // Looks up KV cache entries for a batch of prefix hashes.
  // The lookup processes prefix hashes sequentially and stops at the first miss
  // (a hash with no active registrations). All subsequent prefix hashes in the
  // request are treated as misses and will be absent from the response map.
  rpc Lookup(LookupRequest) returns (LookupResponse) {  }

  // Unregisters a KV cache entry (e.g. on eviction).
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse) {  }

  // Pulls all active registrations owned by a single RaidenId, streamed in
  // batches. Intended for owner restart handling: a restarted owner either
  // reconstructs its local KV cache metadata from the returned entries, or
  // bulk-unregisters them if the backing data did not survive the restart.
  //
  // Consistency: the stream is not a point-in-time snapshot. Each entry is
  // individually consistent at the time its batch is read; entries deleted or
  // expired while the stream is in flight are omitted. In the intended
  // restart workflow the caller is the owner itself and issues no writes
  // during the pull, so the result is effectively complete. Callers pulling
  // a live owner's entries should note that registrations made while the
  // stream is in flight are not guaranteed to be visible. Entry order is
  // unspecified. Batching is a server-side configuration; clients should
  // simply iterate the stream.
  rpc PullOwned(PullOwnedRequest) returns (stream PullOwnedResponse) {  }

  // Registers (or replaces) the network coordinates of a KVCacheStore, keyed by
  // its RaidenId. This is what makes a Lookup result actionable: Lookup returns
  // the RaidenId that owns a block, and ResolveStore turns that RaidenId into
  // an address a peer can dial.
  rpc RegisterStore(RegisterStoreRequest) returns (RegisterStoreResponse) {  }

  // Resolves a RaidenId to the coordinates registered by RegisterStore.
  rpc ResolveStore(ResolveStoreRequest) returns (ResolveStoreResponse) {  }

  // Removes a store registration, together with every block entry the store
  // owns: without an address the blocks cannot be read. Called by a store on
  // clean shutdown.
  rpc UnregisterStore(UnregisterStoreRequest)
      returns (UnregisterStoreResponse) {  }

  // Refreshes a store registration's TTL and updates its mutable status
  // (free capacity today; further per-store signals are added to StoreStatus,
  // not as new RPCs). A store that stops calling this past its TTL expires:
  // it drops out of ResolveStore and GetPlacementTargets, and the periodic
  // cleanup purges the block entries it owns. A store whose registration
  // lapsed must RegisterStore again and re-register blocks as it saves them;
  // purged entries are not restored.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {  }

  // Returns the live stores a pressured store should offer its cold blocks
  // to: members of the caller's kv_pool_group on the nearest evict tier
  // strictly greater than the caller's, ordered by reported free capacity.
  // The caller is identified by its own store registration; NOT_FOUND means
  // it has no live one and must RegisterStore again.
  rpc GetPlacementTargets(GetPlacementTargetsRequest)
      returns (GetPlacementTargetsResponse) {  }

  // Atomically registers the deployment's KVTransferSpec when none is
  // stored yet, otherwise validates the request against the stored spec and
  // rejects any difference. Idempotent by design.
  rpc RegisterKVTransferSpec(RegisterKVTransferSpecRequest)
      returns (RegisterKVTransferSpecResponse) {  }

  // Reads the registered KVTransferSpec. Host store nodes poll this at boot
  // until a serving host has published the spec.
  rpc GetKVTransferSpec(GetKVTransferSpecRequest)
      returns (GetKVTransferSpecResponse) {  }
}

message KVBlockMetadata {
  // Logical owner identity.
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;
  // Identifier for the cache block on the host. Must be non-negative (>= 0),
  // representing the logical index in the host's physical block allocation
  // pool.
  int32 block_id = 2;
}

message RegisterEntry {
  // `bytes`, not `string`: a prefix hash is a raw digest and is essentially
  // never valid UTF-8. proto3 validates `string` on PARSE, so a real hash
  // serializes fine at the sender and then fails to decode at the server,
  // which surfaces as "the registry is broken" rather than "we sent bad
  // data". Both types are length-delimited on the wire, so this is
  // compatible with binaries built before the fix.
  bytes prefix_hash = 1;
  KVBlockMetadata metadata = 2;
  // Time-to-live for this registration in seconds. If positive, the entry will
  // automatically expire and be eligible for background cleanup after this
  // duration. During lookups, expired entries are lazily filtered out.
  //
  // If 0 or negative, the server's default TTL is used (which defaults to 1
  // hour in the server implementation).
  //
  // Rules of thumb for setting TTL:
  // - For stable environments with low worker churn, a longer TTL (e.g., 30+
  // minutes)
  //   is recommended to maximize cache hit rates.
  // - For dynamic environments or unstable workers, a shorter TTL (e.g., 5-10
  // minutes)
  //   helps minimize stale lookups if a worker crashes before unregistering.
  // - The TTL should generally be larger than the expected time between cache
  // reuses.
  int64 ttl_seconds = 3;
}

message RegisterRequest {
  repeated RegisterEntry entries = 1;
}

message RegisterResponse {
  bool success = 1;
  string error_message = 2;
}

message LookupRequest {
  // Ordered list of prefix hashes, from the shortest prefix (e.g., first
  // logical block) to the longest prefix (e.g., full prompt). Each hash is
  // typically computed cumulatively based on the previous prefix hash, forming
  // a dependency chain. The lookup executes sequentially and terminates at the
  // first miss.
  // `bytes` for the reason given on RegisterEntry.prefix_hash.
  repeated bytes prefix_hashes = 1;
}

message LookupResponse {
  // List of metadata corresponding to the prefix hashes in the LookupRequest.
  // The i-th metadata corresponds to the i-th prefix hash in the request.
  // Due to stop-on-first-miss behavior, this list will only contain entries
  // up to the first miss (i.e., its length will be equal to the number of
  // sequential hits before the first miss).
  //
  // TODO: Optimize response size when multiple blocks are on the same
  // worker (e.g., by deduplicating RaidenIds into a list and using
  // indices in results).
  // TODO: Consider supporting replicated cache blocks (which currently
  // overwrite each other in the registry).
  repeated KVBlockMetadata results = 1;
}

message UnregisterRequest {
  // `bytes` for the reason given on RegisterEntry.prefix_hash.
  repeated bytes prefix_hashes = 1;
  tpu_sync.rpc.RaidenIdProto raiden_id = 2;
}

message UnregisterResponse {
  bool success = 1;
  string error_message = 2;
}

message PullOwnedRequest {
  // Owner whose active registrations should be returned.
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;
}

// A single active registration owned by the requested RaidenId.
message PullOwnedEntry {
  // `bytes` for the reason given on RegisterEntry.prefix_hash.
  bytes prefix_hash = 1;
  // Identifier for the cache block on the owner's host. See
  // KVBlockMetadata.block_id.
  int32 block_id = 2;
  // Seconds until this registration expires, rounded up to at least 1 for
  // entries that expire. 0 means the registration does not expire (infinite
  // TTL). Clients may use this as a coarse recency signal when rebuilding
  // local metadata, and refresh it via Register after recovery.
  int64 remaining_ttl_seconds = 3;
}

message PullOwnedResponse {
  // One batch of entries. Batch boundaries carry no meaning.
  repeated PullOwnedEntry entries = 1;
}

// Network coordinates of one KVCacheStore.
message StoreInfo {
  // Identity of the store. Required; acts as the registration key, so a second
  // RegisterStore with the same RaidenId REPLACES the first (which is how a
  // restarted store on a new port heals its own entry).
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;

  // "host:port" of this store's KVCacheStoreService, as peers should dial it.
  // Required.
  string store_server_address = 2;

  // "host:port" of this store's RaidenController service.
  //
  // This is how a peer reaches this store to acquire a read lease, so a store
  // that publishes it empty cannot serve a remote read: the reader fails with
  // FailedPrecondition naming this store rather than dialling "". Not enforced
  // at registration -- the failure belongs at resolve time, where the caller
  // knows which peer it was trying to reach.
  string controller_address = 3;

  // Time-to-live in seconds.
  //
  // NOTE: unlike RegisterEntry.ttl_seconds, 0 or negative means **never
  // expires**, not "use the server default". A store registration is liveness
  // information with no refresh loop yet, so an entry that silently expired
  // would make a running store unresolvable to its peers. The cost of this
  // choice is that a crashed store leaves a stale entry until it restarts and
  // overwrites it. Set a positive TTL once callers refresh their registration.
  int64 ttl_seconds = 4;

  // KV pool group this store belongs to: the same key its group's
  // KVTransferSpec is registered under. Placement never crosses groups.
  // Optional; a store that leaves it empty never serves as a placement
  // target.
  string kv_pool_group = 5;

  // Demotion level for evict placement. Cold blocks flow strictly to greater
  // tiers: serving hosts are tier 0, host store nodes are 1 and up. Assigned
  // by deployment configuration.
  int32 evict_tier = 6;
}

// Mutable per-store state, refreshed by Heartbeat. Every future per-store
// signal (I/O load etc.) is a field added HERE -- one report channel for
// all of them.
message StoreStatus {
  // Free block slots in the store's KV pool. Every store in a kv_pool_group
  // shares the group's block geometry (one KVTransferSpec), so free block
  // counts are directly comparable within a group -- and placement never
  // compares across groups.
  int64 free_blocks = 1;
}

message RegisterStoreRequest {
  StoreInfo store = 1;
}

message RegisterStoreResponse {
  bool success = 1;
  string error_message = 2;
}

message ResolveStoreRequest {
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;
}

message ResolveStoreResponse {
  // False when no live registration exists for the requested RaidenId. The RPC
  // itself still returns OK: "not registered" is an answer, not an error.
  bool found = 1;
  StoreInfo store = 2;
}

// The KV block geometry and transfer topology of a deployment's serving hosts.
// The serving hosts publish it here and host store nodes bootstrap from it.
message KVTransferSpec {
  // One entry per KV cache block array of the serving hosts, per-layer caches
  // have one entry per layer, a unified KV cache has exactly one, and hybrid
  // models one per state array.
  message BlockArray {
    // Bytes one block occupies in this array on one shard.
    int64 block_bytes = 1;
  }
  repeated BlockArray block_arrays = 1;

  // Device shards each block array is split across on a serving host.
  int32 num_kv_shards = 2;

  // Number of transfer workers on the serving hosts, with worker node ids
  // densely assigned [0, num_workers-1]).
  int32 num_workers = 3;
}

message RegisterKVTransferSpecRequest {
  KVTransferSpec spec = 1;
  // Group of raiden units sharing one KV transfer geometry. Specs are
  // registered and validated per group, so differently-shaped groups (e.g.
  // heterogeneous prefill and decode jobs) coexist in one registry.
  // Must not be empty.
  string kv_pool_group = 2;
}

message RegisterKVTransferSpecResponse {
  bool success = 1;
  string error_message = 2;
  // On a mismatch rejection: the spec that is already registered, so the
  // failing publisher's log shows both sides of the disagreement.
  KVTransferSpec registered_spec = 3;
}

message GetKVTransferSpecRequest {
  // The group whose spec to read (see RegisterKVTransferSpecRequest).
  // Must not be empty.
  string kv_pool_group = 1;
}

message GetKVTransferSpecResponse {
  // False when nothing has been published yet. The RPC itself returns OK:
  // "not published yet" is an answer, not an error (mirrors ResolveStore).
  bool found = 1;
  KVTransferSpec spec = 2;
}

message UnregisterStoreRequest {
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;
}

message UnregisterStoreResponse {
  // False if there was nothing registered for that RaidenId.
  bool success = 1;
  string error_message = 2;
}

message HeartbeatRequest {
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;
  StoreStatus status = 2;
}

message HeartbeatResponse {
  // False when no live registration exists for the requested RaidenId --
  // e.g. the registry restarted or the registration expired. The caller
  // must RegisterStore again. The RPC still returns OK: "not registered"
  // is an answer, not an error.
  bool registered = 1;
}

message GetPlacementTargetsRequest {
  // The calling store.
  tpu_sync.rpc.RaidenIdProto raiden_id = 1;

  // Upper bound on returned targets. 0 or negative means the server default.
  int32 max_targets = 2;
}

message GetPlacementTargetsResponse {
  // Live stores of the selected tier, in the order the caller should offer
  // to them: most reported free capacity first, stores reporting none last.
  // Only identity and addresses are populated. May be empty (no greater
  // tier exists -- the caller is the bottom tier and should drop locally).
  repeated StoreInfo targets = 1;
}
