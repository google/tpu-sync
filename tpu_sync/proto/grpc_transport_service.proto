syntax = "proto3";

package tpu_sync.proto;

import "tpu_sync/rpc/weight_transfer_common.proto";

// Wrapper for a single payload buffer so repeated payloads can use CORD.
message ChunkPayload {
  bytes data = 1 [ctype = CORD];
}

// Payload chunk scattered into strided slices at the destination.
message ScatterChunkProto {
  ChunkPayload payload = 1;
  // Starting byte offset in the destination buffer.
  uint64 byte_offset = 2;
  // Size in bytes of each contiguous slice written to the destination.
  // 0 means the entire `payload` is written as a single contiguous slice.
  uint64 byte_size = 3;
  // Start-to-start byte stride between consecutive slices at the destination.
  // 0 means contiguous placement (equivalent to `byte_size`).
  uint64 byte_stride = 4;
}

// Payload chunk gathered into a contiguous destination region.
message GatherChunkProto {
  repeated ChunkPayload payloads = 1;
  // Starting byte offset in the destination buffer.
  uint64 byte_offset = 2;
}

message ChunkProto {
  oneof chunk {
    ScatterChunkProto scatter_chunk = 1;
    GatherChunkProto gather_chunk = 2;
  }
}

message GrpcPushRequest {
  uint64 uuid = 1;
  uint64 buffer_id = 2;
  uint32 shard_id = 3;
  uint64 chunk_batch_id = 4;
  repeated ChunkProto chunks = 5;
}

message GrpcPushResponse {
  tpu_sync.rpc.StatusProto status = 1;
}

message GrpcPullRequest {
  uint64 uuid = 1;
  uint64 buffer_id = 2;
  uint32 shard_id = 3;
  uint64 chunk_batch_id = 4;
}

message GrpcPullResponse {
  repeated ChunkProto chunks = 1;
  tpu_sync.rpc.StatusProto status = 2;
}

// High-throughput gRPC block transport service for TransportAdapter.
service GrpcTransportService {
  // Unary RPC for chunk push.
  rpc PushChunks(GrpcPushRequest) returns (GrpcPushResponse) {  }

  // Server-streaming RPC for scatter-gather chunk pull.
  rpc PullChunks(GrpcPullRequest) returns (stream GrpcPullResponse) {  }
}
