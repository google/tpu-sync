syntax = "proto3";

package tpu_raiden.kv_cache.proto;

import "tpu_sync/proto/worker_service.proto";
import "tpu_sync/rpc/raiden_service.proto";

option java_multiple_files = true;
option java_outer_classname = "KVCacheStoreServiceProto";

// Service exposing remote access to KV cache block transfers.
service KVCacheStoreService {
  // The wire half of a peer's load() of REMOTE blocks: the caller asks this
  // node to copy blocks out of its host DRAM into the caller's host landing
  // blocks (host_block_ids). Requires HOST/HOST_AND_HBM residency here at the
  // source; the caller performs its own H2D afterwards.
  rpc Fetch(FetchRequest) returns (FetchResponse);

  // --- Remote write ---------------------------------------------------------
  //
  // Wire transport for KVCacheStore's save to a destination. The source
  // offers blocks on a WriteRemote call and keeps the call open. The
  // destination allocates landing blocks, pulls the bytes with its own
  // workers, and answers on the same call: one ack, then at most one result.
  // An ack that reports all-exist or partial-exist ends the stream with no
  // operation.
  //
  // The destination pulls, never the reverse: if the source wrote into
  // destination memory, blocks freed mid-transfer could be reallocated and
  // corrupted for an unrelated tenant.
  //
  // The call's deadline is the source's HOLD window: how long the source
  // keeps the offered blocks intact.
  rpc WriteRemote(WriteRemoteRequest) returns (stream WriteRemoteEvent);

  // Recovery only: a source that lost the WriteRemote stream asks once for
  // the operation's state.
  rpc PollWriteRemote(PollWriteRemoteRequest) returns (PollWriteRemoteResponse);
}

// Request to fetch one or more KV cache blocks by hash.
message FetchRequest {
  // Required: Sequence of block hashes to retrieve from the remote server.
  // Raw hash bytes (not UTF-8): proto3 string fields are UTF-8-verified on
  // the wire, which real (binary) block hashes fail.
  repeated bytes block_hashes = 1;

  // Optional: Physical device block IDs on the destination TPU. The server
  // does not consume them: the bytes always land in host_block_ids, and the
  // caller performs its own H2D after this RPC completes.
  // - If NON-EMPTY: Must match block_hashes length.
  repeated int32 device_block_ids = 2;

  // Required: the caller's host landing blocks the bytes are written into.
  // Must match block_hashes size.
  repeated int32 host_block_ids = 3;

  // Target destination info: Unique RaidenId of the client node initiating the
  // fetch.
  tpu_sync.rpc.RaidenIdProto client_raiden_id = 4;

  // Data-plane transfer endpoints of the CLIENT (the node the bytes are
  // written into), one group per worker, tagged with node_id.
  repeated tpu_sync.proto.RaidenWorkerEndpointsProto client_worker_endpoints =
      5;
}

// Response describing the outcome of a fetch request.
message FetchResponse {
  // List of block hashes that were successfully fetched into the target buffer.
  // `bytes` for the reason given on FetchRequest.block_hashes.
  repeated bytes done_block_hashes = 1;

  // List of block hashes that failed to be fetched.
  repeated bytes failed_block_hashes = 2;

  // Error status code or message for detailed reporting.
  string error_message = 3;
}

// What the destination already holds of the offered batch. The same rule is
// applied at ack time and at insert time.
enum WriteExistState {
  WRITE_EXIST_STATE_UNSPECIFIED = 0;  // nothing was already present
  // Every offered hash is already present. Success: hashes are
  // content-addressed, so the peer already has the same bytes. No transfer.
  WRITE_ALL_EXIST = 1;
  // Some but not all are present. Failure; existing_hashes lists what the
  // peer holds, so the source can re-offer the rest.
  WRITE_PARTIAL_EXIST = 2;
}

// The source offers blocks it owns; the destination decides and pulls.
message WriteRemoteRequest {
  // The offering node. The destination pulls from it.
  tpu_sync.rpc.RaidenIdProto src_raiden_id = 1;

  // Must be non-empty; an empty list is INVALID_ARGUMENT.
  repeated bytes block_hashes = 2;

  // The source's host block ids, in block_hashes order. The source pins each
  // one for the life of the operation, so the ids stay valid.
  repeated int32 src_host_block_ids = 3;

  // The source's data-plane worker endpoints, tagged with node_id so each
  // destination worker pairs with the right source worker.
  repeated tpu_sync.proto.RaidenWorkerEndpointsProto src_worker_endpoints = 4;

  // Requested destination deadline, in milliseconds. Must be > 0: proto3
  // sends an unset field as 0, so 0 is a protocol error, not a default.
  int64 deadline_ms = 5;
}

// One message on the WriteRemote stream: the ack first, the result later.
message WriteRemoteEvent {
  oneof event {
    WriteRemoteAck ack = 1;
    WriteRemoteResult result = 2;
  }
}

// What became of the offer: accepted, or settled at once by what the
// destination already holds.
message WriteRemoteAck {
  // Non-zero means accepted and the transfer is running. Zero together with
  // WRITE_EXIST_STATE_UNSPECIFIED is a protocol error.
  uint64 operation_id = 1;

  // What the destination already held of the batch.
  WriteExistState exist_state = 2;

  // Populated iff WRITE_PARTIAL_EXIST.
  repeated bytes existing_hashes = 3;

  // The deadline the destination actually armed, after clamping to its own
  // cap. The source must protect the offered blocks at least this long.
  int64 granted_deadline_ms = 4;

  // How long, from this ack, the destination keeps the operation's record.
  // Lets a source that lost the call tell "never happened" from "asked too
  // late".
  int64 record_ttl_ms = 5;
}

// The operation's final state. Sent once; the stream closes after it.
message WriteRemoteResult {
  // The same enum PollWriteRemote answers with, so the two answers cannot
  // drift apart.
  PollWriteRemoteResponse.State state = 1;
  // Populated iff PARTIAL_EXIST.
  repeated bytes existing_hashes = 2;
  // Populated iff STORED_UNREGISTERED.
  repeated bytes unregistered_hashes = 3;
}

// Asks what became of an accepted offer.
message PollWriteRemoteRequest {
  // The id from the ack.
  uint64 operation_id = 1;

  // 0 answers immediately with the current state. Non-zero asks the
  // destination to hold the call open until the operation is terminal or
  // this many milliseconds pass. The destination caps the wait.
  int64 wait_ms = 2;
}

message PollWriteRemoteResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Not terminal yet.
    PENDING = 1;
    // Inserted and registered globally. Success, and the only state that
    // lets an eviction caller free its own copy.
    COMMITTED = 2;
    // A concurrent writer committed every hash first. Success: the
    // post-condition holds; the transferred bytes are discarded.
    ALL_EXIST = 3;
    // Some hashes were present at insert time. Failure; existing_hashes is
    // set.
    PARTIAL_EXIST = 4;
    // The transfer failed, or finished past the deadline.
    FAILED = 5;
    // No record: aged out, or the destination restarted. Treat as failure.
    UNKNOWN = 6;
    // The bytes arrived and the destination kept them, but publishing to the
    // global registry failed, so no peer can find them. Not COMMITTED:
    // COMMITTED lets the source free its own copy, which here would leave no
    // findable copy anywhere. The source decides what to do;
    // unregistered_hashes carries the list.
    STORED_UNREGISTERED = 7;
  }
  State state = 1;
  // Populated iff COMMITTED.
  repeated bytes committed_hashes = 2;
  // Populated iff FAILED.
  repeated bytes failed_hashes = 3;
  // Populated iff PARTIAL_EXIST. Also carried on the ack and the streamed
  // result.
  repeated bytes existing_hashes = 4;
  // Populated iff STORED_UNREGISTERED.
  repeated bytes unregistered_hashes = 5;
}
