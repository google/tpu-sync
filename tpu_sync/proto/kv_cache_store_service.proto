syntax = "proto3";

package tpu_raiden.kv_cache.proto;

import "tpu_sync/proto/worker_service.proto";
import "tpu_sync/rpc/raiden_service.proto";

option java_multiple_files = true;
option java_outer_classname = "KVCacheStoreServiceProto";

// Service exposing remote access to KV cache block transfers.
service KVCacheStoreService {
  // The wire half of a peer's load() of REMOTE blocks: the caller asks this
  // node to copy blocks out of its host DRAM into the caller's host landing
  // blocks (host_block_ids). Requires HOST/HOST_AND_HBM residency here at the
  // source; the caller performs its own H2D afterwards.
  rpc Fetch(FetchRequest) returns (FetchResponse);

  // --- Remote write (source-offered, destination-pulled) -------------------
  //
  // WriteRemote makes a peer take a copy of blocks this node owns. These two
  // RPCs are the wire transport behind KVCacheStore's save to a destination
  // (save(hashes, dst)), not a caller-facing API of their own. The use case
  // is proactive eviction: a node under memory pressure offers cold blocks to
  // a peer, then frees them locally.
  //
  //   WriteRemote      the SOURCE offers, on a call it then KEEPS OPEN. The
  //                    destination tests what it already holds, allocates
  //                    landing blocks all-or-nothing, issues the pull, and
  //                    writes an ack carrying an operation_id -- it does NOT
  //                    wait for the data. When the operation becomes terminal
  //                    it writes the result on that same call and closes it.
  //   (no RPC)         the DESTINATION's own workers pull the bytes.
  //   PollWriteRemote  only for a source that LOST the call and wants to ask
  //                    once more. Not on any hot path.
  //
  // Why the destination pulls, and why this is not negotiable: if the
  // SOURCE's workers wrote into destination blocks, a destination that gave
  // up mid-transfer would free and reallocate them, and the source's
  // in-flight write would corrupt an unrelated tenant. No commit-time check
  // can detect that, because the damage is to a third party. With a pull,
  // only the destination writes its own memory, so it simply does not free
  // blocks whose transfer future it still holds.
  //
  // There is deliberately NO lease here, unlike the read path: the source
  // INITIATES and holds its own pins, so there is nothing to negotiate.
  //
  // Exactly one Ack, then AT MOST one Result. An Ack reporting all-exist or
  // partial-exist ends the stream: no operation is created and there is
  // nothing further to report.
  //
  // The call's DEADLINE is the source's HOLD window -- the period it promises
  // to keep the offered blocks intact. That is not decoration: it is the only
  // clock in this protocol, and it is why neither side runs a timer for a
  // remote write. The result arrives on the call, and the HOLD expiring
  // arrives on the same call as DEADLINE_EXCEEDED.
  rpc WriteRemote(WriteRemoteRequest) returns (stream WriteRemoteEvent);
  rpc PollWriteRemote(PollWriteRemoteRequest) returns (PollWriteRemoteResponse);
}

// Request to fetch one or more KV cache blocks by hash.
message FetchRequest {
  // Required: Sequence of block hashes to retrieve from the remote server.
  // Raw hash bytes (not UTF-8): proto3 string fields are UTF-8-verified on
  // the wire, which real (binary) block hashes fail.
  repeated bytes block_hashes = 1;

  // Optional: Physical device block IDs on the destination TPU. The server
  // does not consume them: the bytes always land in host_block_ids, and the
  // caller performs its own H2D after this RPC completes.
  // - If NON-EMPTY: Must match block_hashes length.
  repeated int32 device_block_ids = 2;

  // Required: the caller's host landing blocks the bytes are written into.
  // Must match block_hashes size.
  repeated int32 host_block_ids = 3;

  // Target destination info: Unique RaidenId of the client node initiating the
  // fetch.
  tpu_sync.rpc.RaidenIdProto client_raiden_id = 4;

  // Data-plane transfer endpoints of the CLIENT (the node the bytes are
  // written into), one group per worker, tagged with node_id.
  repeated tpu_sync.proto.RaidenWorkerEndpointsProto client_worker_endpoints =
      5;
}

// Response describing the outcome of a fetch request.
message FetchResponse {
  // List of block hashes that were successfully fetched into the target buffer.
  // `bytes` for the reason given on FetchRequest.block_hashes.
  repeated bytes done_block_hashes = 1;

  // List of block hashes that failed to be fetched.
  repeated bytes failed_block_hashes = 2;

  // Error status code or message for detailed reporting.
  string error_message = 3;
}

// What the destination already holds of the offered batch. Applied by ONE
// rule, at BOTH ack time and insert time -- which is what makes the two
// coherent. Without a single rule the same condition is success if a race
// lands early and failure if it lands late.
enum WriteExistState {
  WRITE_EXIST_STATE_UNSPECIFIED = 0;  // nothing was already present
  // Every offered hash is already present. SUCCESS: hashes are content-
  // addressed, so the peer having it means the peer has the same bytes --
  // exactly the post-condition the caller wanted. No transfer is performed.
  WRITE_ALL_EXIST = 1;
  // Some but not all are present. FAILURE: a partial batch does not satisfy
  // the request, and reporting success would let an eviction caller free
  // blocks the peer does not have. existing_hashes lists what it does have,
  // so the source can re-offer only the difference.
  WRITE_PARTIAL_EXIST = 2;
}

// The source offers blocks it owns; the destination decides and pulls.
message WriteRemoteRequest {
  // Identifies the offering node. The destination pulls FROM it.
  tpu_sync.rpc.RaidenIdProto src_raiden_id = 1;

  // MUST be non-empty; an empty list is INVALID_ARGUMENT.
  repeated bytes block_hashes = 2;

  // The source's authoritative host block ids, in block_hashes order. Unlike
  // the read path's advisory ids these are correct by construction: the
  // source holds an internal pin on every one for the life of the operation.
  repeated int32 src_host_block_ids = 3;

  // The source's worker endpoint groups, tagged with node_id so each
  // destination worker pairs with the source worker holding its shards.
  // DATA-plane endpoints, not control.
  repeated tpu_sync.proto.RaidenWorkerEndpointsProto src_worker_endpoints = 4;

  // Requested destination deadline, in milliseconds. MUST be > 0.
  //
  // proto3 gives a scalar no presence, so an unset field arrives as 0 and
  // would otherwise read as "deadline already passed", failing every write at
  // the pre-pull check. 0 is therefore a protocol error, not a default.
  int64 deadline_ms = 5;
}

message WriteRemoteEvent {
  oneof event {
    WriteRemoteAck ack = 1;
    WriteRemoteResult result = 2;
  }
}

// What became of the OFFER: accepted, or settled on the spot by what the
// destination already holds.
message WriteRemoteAck {
  // Non-zero => accepted and the transfer is proceeding. Zero together with
  // WRITE_EXIST_STATE_UNSPECIFIED is a PROTOCOL ERROR (a default-initialised
  // message), not a silent no-op.
  uint64 operation_id = 1;

  WriteExistState exist_state = 2;

  // Populated iff WRITE_PARTIAL_EXIST.
  repeated bytes existing_hashes = 3;

  // The deadline actually armed, after clamping to the destination's own cap.
  // AUTHORITATIVE: the source validates that its own HOLD exceeds this. The
  // two values live in different processes, so neither side can check the
  // invariant alone -- and an inverted pair lets the source stop protecting
  // its blocks while the destination is still pulling them.
  int64 granted_deadline_ms = 4;

  // How long this destination keeps the operation's record after it goes
  // terminal. Without it, a source that lost the call cannot tell an UNKNOWN
  // meaning "never happened" from one meaning "you asked too late": the two
  // hosts can be configured differently and nothing else on the wire says so.
  int64 record_ttl_ms = 5;
}

// What became of the OPERATION. Written the moment it goes terminal, and the
// stream closes after it.
message WriteRemoteResult {
  // The same enum the poll answers with, deliberately: one set of states with
  // one meaning, so the streamed and the polled answer cannot drift.
  PollWriteRemoteResponse.State state = 1;
  // Populated iff PARTIAL_EXIST.
  repeated bytes existing_hashes = 2;
  // Populated iff STORED_UNREGISTERED.
  repeated bytes unregistered_hashes = 3;
}

message PollWriteRemoteRequest {
  uint64 operation_id = 1;

  // 0 (the default) is the original behaviour: answer with whatever the state
  // is right now. Non-zero asks the destination to HOLD the call open until
  // the operation is terminal or this many milliseconds pass, whichever comes
  // first -- so that a source which lost the stream can wait for the real
  // answer instead of being told PENDING. The source still bounds the wait
  // with its own call deadline, and the destination caps it independently;
  // this only tells the destination it may keep the answer rather than send
  // PENDING straight back.
  int64 wait_ms = 2;
}

message PollWriteRemoteResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    PENDING = 1;
    // Inserted AND registered globally. SUCCESS -- and the only state an
    // eviction caller may free its own copy on. A COMMITTED that meant
    // "inserted" alone would let the source free blocks that no lookup
    // anywhere can reach.
    COMMITTED = 2;
    // A concurrent writer committed every one of our hashes first. SUCCESS:
    // our blocks are freed and the bytes we moved are discarded, but the
    // post-condition holds.
    ALL_EXIST = 3;
    // Some of our hashes were present at insert time. FAILURE;
    // existing_hashes is set. Our blocks are freed.
    PARTIAL_EXIST = 4;
    FAILED = 5;
    // Aged out, or the destination restarted. Indistinguishable from "never
    // happened": treat as failure.
    UNKNOWN = 6;
    // The bytes ARRIVED and the destination kept them, but publishing them to
    // the global registry failed, so no peer can find them.
    //
    // Deliberately not COMMITTED. Nothing is corrupt -- hashes are content-
    // addressed and an unpublished block is invisible, not wrong -- but
    // COMMITTED is what licenses an eviction caller to drop its own copy, and
    // doing that here would move the block from "on the source, findable" to
    // "on the destination, findable by nobody". That is worse than never
    // having sent it, and it costs a full transfer to get there.
    //
    // So the destination reports what actually happened and the SOURCE
    // decides: keep its copy (the safe default), free it anyway because the
    // peer is good enough, or leave it alone rather than re-offering bytes the
    // peer already holds. unregistered_hashes carries the list.
    STORED_UNREGISTERED = 7;
  }
  State state = 1;
  repeated bytes committed_hashes = 2;
  repeated bytes failed_hashes = 3;
  // Populated iff PARTIAL_EXIST. Carried here as well as on
  // WriteRemoteResponse so the source never has to remember which reply the
  // list arrived on.
  repeated bytes existing_hashes = 4;
  // Populated iff STORED_UNREGISTERED: the destination holds these, but no
  // lookup will find them.
  repeated bytes unregistered_hashes = 5;
}
