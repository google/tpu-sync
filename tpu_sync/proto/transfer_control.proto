syntax = "proto3";

package tpu_sync.proto;

option java_multiple_files = true;
option java_outer_classname = "TransferControlProto";

enum TransferControlStatusCode {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_NOT_REGISTERED = 2;
  STATUS_BLOCK_VALIDATION_FAILED = 3;
  STATUS_STAGING_UNAVAILABLE = 4;
  STATUS_SHUTTING_DOWN = 5;
  STATUS_INTERNAL_ERROR = 6;
}

message PullStreamRequest {
  uint64 uuid = 1;
  string req_id = 2;
  uint32 ep_idx = 3;
  uint32 consumer_data_port = 4;
  repeated string consumer_ips = 5;
  repeated int64 src_block_ids = 6;
  repeated int64 dst_block_ids = 7;
  int64 timeout_ms = 8;
}

message PullStreamResponse {
  bool success = 1;
  TransferControlStatusCode status = 2;
  uint32 num_layers = 3;
  uint32 data_port = 4;
  string error_message = 5;
}

message TransferAckRequest {
  uint64 uuid = 1;
  string req_id = 2;
  bool success = 3;
  string message = 4;
}

message TransferAckResponse {
  bool success = 1;
  string message = 2;
}

message TransferLivenessRequest {
  string client_id = 1;
}

message TransferLivenessResponse {
  bool ready = 1;
  int32 active_workers = 2;
  string version = 3;
}

service TransferControlService {
  // Coordinates a pull transfer from producer to consumer.
  rpc PullStream(PullStreamRequest) returns (PullStreamResponse) {  }

  // Acknowledges completion or settlement of a transfer.
  rpc Ack(TransferAckRequest) returns (TransferAckResponse) {  }

  // Checks readiness and liveness of the transfer control service.
  rpc CheckLiveness(TransferLivenessRequest)
      returns (TransferLivenessResponse) {  }
}
