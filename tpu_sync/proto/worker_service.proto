syntax = "proto3";

package tpu_sync.proto;

import "tpu_sync/proto/transfer_program.proto";
import "tpu_sync/rpc/raiden_service.proto";

// Service providing a gRPC communication channel between Raiden Controller and
// Transfer Workers for buffer allocation and memory management.
//
// Assumption: The WorkerService runs on every KV cache manager instance or
// weight sync instance and is managed exclusively by its local controller.
// There is no concurrent multi-caller access or contention on buffer indices
// across separate controllers.
// TODO(justinlu): Investigate enforcing this contract by restricting RPC access
// so that only the local controller is permitted to invoke these methods.
service WorkerService {
  // Allocates a list of sharded buffers on the transfer worker.
  rpc CreateBuffers(CreateBuffersRequest) returns (CreateBuffersResponse);

  // Deallocates previously allocated sharded buffers on the transfer worker.
  rpc DeleteBuffers(DeleteBuffersRequest) returns (DeleteBuffersResponse);

  // Transfers (copies) data across memory spaces on the transfer worker.
  // The transfer specification specifies disjoint memory regions in one buffer.
  // The transfer applies uniformly to all buffers, i.e., all shards across all
  // major dimensions (such as layers or blocks).
  rpc TransferBuffers(TransferBuffersRequest) returns (TransferBuffersResponse);

  // Submits a uniform TransferProgram execution plan to this worker for
  // asynchronous execution.
  rpc SubmitTransferProgram(TransferProgramRequest)
      returns (TransferProgramResponse);

  // Polls the execution status of a previously submitted TransferProgram.
  rpc PollTransfer(PollTransferRequest) returns (PollTransferResponse);

  // Aborts an in-flight TransferProgram on this worker.
  rpc AbortTransfer(AbortTransferRequest) returns (AbortTransferResponse);

  // Registers storage backends dynamically on worker startup.
  rpc RegisterBackends(RegisterBackendsRequest)
      returns (RegisterBackendsResponse);
}

// Transfer endpoint descriptor for worker sub-managers.
message RaidenTransferEndpointProto {
  string endpoint = 1;
  repeated int64 shards = 2;
}

// A group of transfer endpoints owned by a single peer worker (a worker may
// expose more than one endpoint, e.g. one per NUMA sub-manager). Used to carry,
// per destination worker, that worker's endpoints so a source worker can be
// matched to its exact destination peer worker by node_id.
message RaidenWorkerEndpointsProto {
  repeated RaidenTransferEndpointProto endpoints = 1;
  // Mesh node identifier of the worker that owns these endpoints. The source
  // controller matches each of its workers to the destination group with the
  // same node_id.
  int64 node_id = 2;
  // Owning worker id (diagnostics/logging only; matching uses node_id).
  string worker_id = 3;
}

// Uniquely identifies a buffer handle on a worker.
message BufferHandleProto {
  uint64 handle = 1;
}

// Represents a sharded buffer composed of multiple shard buffer handles.
message BufferProto {
  repeated BufferHandleProto buffer_handles = 1;
  optional int32 index = 2;
  tpu_sync.rpc.MemoryType memory_type = 3;
  string remote_address = 4;
  repeated RaidenTransferEndpointProto remote_descriptors = 9;
  // Ordered per-destination-worker endpoint groups (sorted by worker index),
  // populated by ReadRemote so the source controller can match each of its
  // workers to the exact destination peer worker. Once the source narrows this
  // down to the matched peer, that worker's endpoints are moved into
  // remote_descriptors before dispatch (so remote_worker_endpoints is empty on
  // the wire to a worker).
  // TODO: This grouping is duplicated on every dst buffer; it could
  // instead be a single repeated field on the transfer request.
  repeated RaidenWorkerEndpointsProto remote_worker_endpoints = 10;
}

// Specification for creating/allocating a sharded buffer in host RAM.
message CreateBufferSpec {
  // Number of shard partitions for this sharded buffer.
  int32 num_shards = 1;
  // Size of each buffer shard allocation in bytes.
  int64 size_bytes = 2;
}

// Request to allocate one or more sharded buffers on a transfer worker.
message CreateBuffersRequest {
  // Target Raiden work unit (job/replica identifier).
  tpu_sync.rpc.RaidenIdProto unit = 1;
  // List of sharded buffer specifications to allocate.
  repeated CreateBufferSpec buffers = 2;
}

// Response from allocating sharded buffers.
message CreateBuffersResponse {
  bool success = 1;
  string message = 2;
  // Created sharded buffers, ordered corresponding to the request specs.
  repeated BufferProto buffers = 3;
}

// Request to deallocate previously allocated sharded buffers on a transfer
// worker.
message DeleteBuffersRequest {
  // Target Raiden work unit (job/replica identifier).
  tpu_sync.rpc.RaidenIdProto unit = 1;
  // List of sharded buffers to deallocate.
  repeated BufferProto sharded_buffers = 2;
}

// Response from deallocating sharded buffers.
message DeleteBuffersResponse {
  bool success = 1;
  string message = 2;
}

// Simple transfer direction enum for storage operations.
enum TransferDirection {
  TRANSFER_DIR_UNSPECIFIED = 0;
  TRANSFER_DIR_OFFLOAD = 1;  // Host RAM -> Storage (Write)
  TRANSFER_DIR_RECALL = 2;   // Storage -> Host RAM (Read)
}

// Per-block storage locator descriptor.
message StorageKeyDescriptor {
  // WHAT: Fully resolved physical storage locator or object identifier
  // (e.g. "/tmp/raiden_proto_storage/rank_0/block_hash_a.bin" or
  // "k5://block_hash_a"). WHY: Computed by BlockKeyMapper in KVCacheStore
  // before issuing TransferBuffers. Low-level storage backend drivers
  // (PosixKVCacheStoreBackend, K5BackendMock) need the exact file path or URI
  // to execute system I/O calls (open, read, write).
  string storage_key = 1;

  // WHAT: Linear byte offset from the start of the storage file, object, or
  // shared memory region where block payload starts (default 0). WHY: Enables
  // packed archive files or shared memory segments (e.g. K5 shared memory)
  // containing multiple KV blocks to seek to payload boundaries without
  // separate files.
  int64 offset_bytes = 2;

  // WHAT: Optional POSIX shared memory file descriptor passed across process
  // boundaries via Unix Domain Sockets (IPC) (default -1). WHY: Enables
  // zero-copy inter-process communication for shared-memory daemons (e.g. K5
  // Thick Client daemon) via sendmsg(SCM_RIGHTS).
  int32 file_descriptor = 3;
}

// Batch-level storage transfer specification.
message StorageTransferSpec {
  // WHAT: Simplified direction of copy (TRANSFER_DIR_OFFLOAD vs
  // TRANSFER_DIR_RECALL). WHY: Storage backends only care whether they are
  // writing from Host RAM to storage or reading into Host RAM.
  TransferDirection direction = 1;

  // WHAT: Abstract string identifying the storage backend driver family
  // (e.g. "local_disk", "lustre", "k5").
  // WHY: Used by WorkerServiceImplMock for dynamic factory driver lookup, and
  // deduplicates the medium string ONCE per batch instead of repeating it per
  // block.
  string scheme = 2;

  // WHAT: Map keyed by host buffer index (0..N-1) containing the
  // StorageKeyDescriptor for each block in the transfer batch. WHY: Explicitly
  // correlates host buffer index i to its storage locator, preventing
  // positional array index misalignment bugs while keeping BufferProto 100%
  // pure.
  map<int32, StorageKeyDescriptor> keys_by_buffer_index = 3;
}

// Specification for copying disjoint memory regions in one buffer.
// The transfer applies uniformly to all buffers, i.e., across all shards and
// all major dimensions (such as layers or blocks).
message TransferBufferSpec {
  // Source block offsets.
  repeated int64 src_offsets = 1;
  // Destination block offsets.
  repeated int64 dst_offsets = 2;
  // Number of contiguous blocks to copy per segment (defaults to 1 per segment
  // if not specified).
  repeated int64 copy_sizes = 3;
  // Memory type of the source buffer (e.g., HBM for D2H, DRAM for H2D).
  tpu_sync.rpc.MemoryType src_mem_type = 4;
  // Memory type of the destination buffer (e.g., DRAM for D2H, HBM for H2D).
  tpu_sync.rpc.MemoryType dst_mem_type = 5;
  reserved 6;
  // Source buffers for transfer.
  repeated BufferProto src_buffers = 7;
  // Destination buffers for transfer.
  repeated BufferProto dst_buffers = 8;
  // Host DRAM staging (bridge) blocks for 2-stage remote transfers
  // (remote H2D read/write and remote D2H write). Always the MIDDLE hop of the
  // data flow: local host staging for H2dRead/D2hWrite, remote host staging
  // for H2dWrite. Must be explicit and caller-owned -- never aliased to a
  // peer's block id. Required (same length as src/dst offsets) for those
  // transfer types; unused otherwise.
  repeated BufferProto staging_host_buffers = 9;
  // Option B storage transfer specification containing direction, scheme,
  // and keys_by_buffer_index. Carries all storage metadata for transfers
  // involving MEMORY_TYPE_STORAGE without altering core production messages.
  StorageTransferSpec storage_spec = 10;
}

// Request to transfer data across memory spaces on a transfer worker.
// The transfer specification applies to all buffers (all shards and major
// dimensions).
message TransferBuffersRequest {
  // Transfer specification to execute across all buffers.
  TransferBufferSpec transfer = 1;
}

// Response from transferring sharded buffers.
message TransferBuffersResponse {
  bool success = 1;
  string message = 2;
}

message BackendConfig {
  string name = 1;
  string scheme = 2;
  uint64 capacity = 3;
  map<string, string> properties = 4;
}

message RegisterBackendsRequest {
  repeated BackendConfig configs = 1;
}

message RegisterBackendsResponse {
  bool success = 1;
  string error_message = 2;
}
