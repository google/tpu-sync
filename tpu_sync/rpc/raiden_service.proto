syntax = "proto3";

package tpu_sync.rpc;

option java_multiple_files = true;
option java_outer_classname = "RaidenServiceProto";

message RaidenIdProto {
  string job_name = 1;
  string job_replica_id = 2;
  string data_name = 3;
  int32 data_replica_idx = 4;
}

// Coordinate intervals representing a contiguous slice along a single tensor
// dimension.
message NDSliceDimensionProto {
  // Inclusive start coordinate.
  int64 start = 1;
  // Exclusive end coordinate.
  int64 end = 2;
}

// Slices representing a multi-dimensional bounding box inside a distributed
// tensor.
message NDSliceProto {
  // Dimension intervals ordered from outer-most dimension to inner-most minor
  // dimension.
  repeated NDSliceDimensionProto dimensions = 1;
}

// A strided run of live bytes inside one pool block.
message RegionSpecProto {
  string name = 1;
  int64 offset_bytes = 2;
  int64 stride_bytes = 3;
  int64 unit_bytes = 4;
  int64 num_units = 5;
  int64 units_per_stride = 6;
}

// One block pool inside a wrapped storage. tag and dtype_tag are opaque to
// raiden: stored, filtered, and echoed, never parsed.
message PoolSpecProto {
  string tag = 1;
  int64 storage_index = 2;
  int64 base_offset_bytes = 3;
  int64 block_stride_bytes = 4;
  int64 num_blocks = 5;
  repeated RegionSpecProto regions = 6;
  string dtype_tag = 7;
}

message VariableMetadataProto {
  string name = 1;
  repeated int64 shape = 2;
  repeated int64 mesh_shape = 3;
  repeated int32 layout = 4;
  int32 item_size = 5;
  int32 layer_idx = 6;
  repeated string sharding_spec = 7;
}

message RegisterWorkUnitRequest {
  RaidenIdProto unit = 1;
  repeated string shards = 2;
  string control_plane_rpc_address = 3;
  int32 itemsize = 5;
  repeated int64 mesh_shape = 6;
  repeated int32 layout = 7;
  repeated int64 global_shape = 8;
  // Canonical explicit-pool manifest and physical layout identity used by the
  // controller to fail closed before planning a raw-byte pool transfer.
  repeated PoolSpecProto pools = 9;
  string layout_fingerprint = 10;
  int64 page_tokens = 11;
  int32 transfer_parallelism = 12;
  // Stable transfer rank inside the producer group. This is distinct from
  // data_replica_idx (the DP engine identity); declared source spans arrive on
  // the registration of the rank that owns them.
  int32 transfer_rank = 13;

  // Multi-variable manifest
  repeated VariableMetadataProto variables = 14;
  // Optional list of logical mesh axis names (e.g. ['fsdp', 'tp']).
  repeated string mesh_axes = 15;
}

// Defines an explicit 1D linear memory push operation from a local source to a
// remote destination shard.
message ShardPushEntryProto {
  // Network coordinate "ip:port" or BNS of the remote Destination Worker Data
  // servicer.
  string dst_peer = 1;
  // Logical shard partition index managed by the target Destination Worker
  // process.
  int32 dst_shard_idx = 2;
  // Exact linear memory byte offset to paste data into within the target
  // destination buffer.
  int64 dst_offset_bytes = 3;
  // Exact linear memory byte offset to copy data out of within the local source
  // buffer.
  int64 src_offset_bytes = 4;
  // Number of continuous bytes to transmit across the TCP stream.
  int64 size_bytes = 5;
  int32 src_block_id = 6;
  int32 dst_block_id = 7;
  int64 src_stride_bytes = 8;
  int64 dst_stride_bytes = 9;
  int32 count = 10;
  optional int32 layer_idx = 11;
  // Index into StartTransferRequest.pool_groups scoping this entry to one
  // tag class's pools. Meaningful only when pool_groups is non-empty
  // (multi-tag transfers); single-tag plans leave it zero and scope every
  // entry to every transfer pool, preserving the legacy replay.
  optional int32 pool_group = 12;
}

// A collection of network push entries orchestrated by a specific source TPU
// shard.
message ShardPushScheduleProto {
  repeated ShardPushEntryProto entries = 1;
}

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  MEMORY_TYPE_DRAM = 1;
  MEMORY_TYPE_HBM = 2;
}

message StartTransferRequest {
  repeated RaidenIdProto src_units = 1;
  repeated RaidenIdProto dst_units = 2;
  // Centralized transfer execution plans mapped by local Source Worker logical
  // shard partition index.
  map<int32, ShardPushScheduleProto> shard_push_schedules = 3;
  int64 uuid = 4;
  bool is_sender = 5;
  MemoryType dst_mem_type = 6;
  bool use_block_chunks = 7;
  int64 expected_block_count = 8;
  string req_id = 9;
  // Sender's per-pool dtype tags in canonical pool order. When non-empty and
  // the receiving manager has explicitly registered pools, the tags must match
  // the local pools' dtype tags at plan registration.
  repeated string pool_dtype_tags = 10;
  // Retired scalar mirrors of the pool-group fields (expected pushes,
  // block-id lists, extents, and audit num_tokens): a pool reshard plan is
  // a list of groups, and entries name their group. The per-pool block ids
  // derive from group entries; the flat destination list is the groups'
  // concatenation.
  reserved 11, 13, 14, 16, 17;
  // Canonical pool indices moved by this plan, resolved by the controller
  // from the consumer's requested pool tags. Non-empty selects the pool
  // executor; the groups below must partition exactly this set. Unselected
  // pools are never armed; raiden attaches no meaning to any tag name.
  repeated int32 transfer_pool_indices = 12;
  int32 parallelism = 15;
  optional bool skip_d2h = 18;
  // One group per requested pool tag, in request order — mandatory for
  // pool reshard plans. Each group scopes its schedule entries
  // (ShardPushEntryProto.pool_group) to its own pools, destination
  // block-id space, extents, and receive accounting.
  repeated PoolGroupProto pool_groups = 19;
  // Keyed by layer index. If true, indicates that tiling/detiling should be
  // skipped for the corresponding layer because the source and destination
  // shards have identical shapes, layouts, and mesh configurations.
  map<int32, bool> skip_tiling = 20;
  // Keyed by layer/tensor index. Specifies the expected number of push chunks
  // destined for this receiver for each layer/tensor. Used to trigger pipelined
  // per-layer H2D upon completion of all chunks for a layer.
  map<int32, int64> expected_layer_chunk_counts = 21;
}

// One tag class's slice of a multi-tag byte-span transfer.
message PoolGroupProto {
  // Canonical pool indices this group's entries replay over.
  repeated int32 pool_indices = 1;
  // The group's destination block-id space: entry dst_block_id values for
  // this group index into the group's own destination blocks.
  repeated int64 dst_device_block_ids = 2;
  // Independent push streams expected per pool of this group before its
  // completion callback fires.
  int32 expected_pushes = 3;
  // Expected destination coverage end per entry of dst_device_block_ids
  // (byte-level receiver validation for this group).
  repeated int64 dst_expected_extent_bytes = 4;
  // H2D upload ordering rank: groups upload in ascending order_rank;
  // groups sharing a rank upload independently. The connector places the
  // FA payload at rank 0 and the GDN state classes at rank 1 so state
  // bytes land last on aliased arena pages.
  int32 order_rank = 5;
}

message GetMetadataResponse {
  repeated RegisterWorkUnitRequest metadata = 1;
}

message ControlRequest {
  enum Command {
    COMMAND_UNSPECIFIED = 0;
    COMMAND_START_TRANSFER = 1;
    COMMAND_SHUTDOWN = 2;
    COMMAND_REGISTER_WORK_UNIT = 3;
    COMMAND_GET_METADATA = 4;
    COMMAND_REGISTER_TRANSFER_SCHEDULE = 5;
  }
  Command command = 1;
  repeated string peers = 2;

  StartTransferRequest start_transfer_request = 3;
  RegisterWorkUnitRequest register_work_unit_request = 4;
}

message ControlResponse {
  bool success = 1;
  string message = 2;
  string response_data = 3;
  GetMetadataResponse get_metadata_response = 4;
}

// Service providing a gRPC communication channel for Weight Synchronizer worker control plane.
service WeightSynchronizationWorkerService {
  // Handles generic ControlRequest commands (such as START_TRANSFER, SHUTDOWN).
  rpc HandleControl(ControlRequest) returns (ControlResponse) {  }
}


