syntax = "proto3";

package tpu_sync.rpc;

option java_multiple_files = true;
option java_outer_classname = "WeightTransferCommonProto";

// Version of a model's weights: opaque bytes that name one set of weights and
// are never reused for different weights. Raiden compares versions bytewise
// for equality and never parses, orders or hashes them, so the caller chooses
// the scheme and decides which version is newer. Wherever a request carries a
// version, a `tag` over kMaxWeightVersionBytes = 256 bytes is
// INVALID_ARGUMENT naming the field and both sizes. Logs and errors show a
// version bounded and escaped: its length and at most its first 64 bytes.
message WeightVersion {
  // 1 to 256 bytes. Empty, or an unset message, means "no version", which a
  // request that requires a version rejects with INVALID_ARGUMENT.
  bytes tag = 1;
}
