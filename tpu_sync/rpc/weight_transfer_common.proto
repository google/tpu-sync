syntax = "proto3";

package tpu_sync.rpc;

option java_multiple_files = true;
option java_outer_classname = "WeightTransferCommonProto";

// Messages shared by the worker-facing (`weight_transfer_worker_service.proto`)
// and controller-facing (`weight_transfer_controller_service.proto`)
// control-plane messages for versioned weight transfers.

// Version of a model's weights, ordered lexicographically by
// `(epoch, version_id)`. An unset message, or one with both fields 0, means
// "no version".
message WeightVersion {
  // Optional major epoch that strictly increases when `version_id` may roll
  // back (for example, when a restarted producer restores an older checkpoint
  // on a host whose wall clock may be skewed). Callers whose `version_id` is
  // already globally monotonic leave this 0.
  int64 epoch = 1;
  // Monotonically increasing version identifier within `epoch` (for example, a
  // publish sequence number or step counter).
  int64 version_id = 2;
}
