syntax = "proto3";

package tpu_raiden.transport.lib.proto;

// High-throughput gRPC block transport service for TransportAdapter.
service GrpcTransportService {
  // Unary RPC for Opcode 1 (dynamic destination block allocation push)
  // and Opcode 6 (explicit destination block push).
  rpc PushBlocks(GrpcPushRequest) returns (GrpcPushResponse) {  }
}

message ChunkProto {
  uint32 version = 1;
  uint32 op = 2;
  uint32 flags = 3;
  uint32 buffer_id = 4;
  uint32 reserved = 5;
  uint32 metadata_size = 6;
  uint32 remote_id = 7;
  uint32 local_id = 8;
  uint32 count_or_size = 9;
  uint64 uuid = 10;
  bytes payload = 11 [ctype = CORD];
}

message GrpcPushRequest {
  repeated ChunkProto chunks = 1;
  // Populated when op == 6 (Explicit destination push).
  repeated int32 dst_block_ids = 2;
  repeated int32 src_block_ids = 3;
}

message GrpcPushResponse {
  bool ack = 1;
  // Populated when op == 1 (Dynamic block allocation push).
  repeated int32 allocated_block_ids = 2;
  string error_message = 3;
}
